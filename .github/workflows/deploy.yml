name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false          # never kill a deploy mid-rsync

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production           # scopes secrets, adds optional approval
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci                   # lockfile drift fails the build

      - name: Build site
        run: npm run build            # vue-tsc type check, then vite build (production by default)

      - name: Verify build output
        run: |
          test -s dist/index.html
          # a real build currently emits 9 files (index.html, favicon, templates/, assets/)
          [ "$(find dist -type f | wc -l)" -ge 6 ]
          ls dist/assets/*.js dist/assets/*.css >/dev/null

      - name: Tailscale authenticate
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.K8S_CONTROL_HOST }}

      # No SSH key or known_hosts pinning: the target node runs Tailscale SSH
      # (`tailscale set --ssh`), so tailscaled terminates SSH and authenticates
      # this runner by its tailnet identity (tag:ci) using auth type `none`.
      # The peer is already authenticated by WireGuard, and Tailscale presents
      # its own host key rather than the node's, so pinning one would only break.
      - name: Deploy site files
        env:
          K8S_CONTROL_USER: ${{ secrets.K8S_CONTROL_USER }}
          K8S_CONTROL_HOST: ${{ secrets.K8S_CONTROL_HOST }}
        run: |
          rsync -rlptzv --delete --chmod=D755,F644 \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ \
            "${K8S_CONTROL_USER}@${K8S_CONTROL_HOST}:/var/www/sites/manikure/"
